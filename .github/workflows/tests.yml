name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
        include:
          # The setup scripts promise Python 3.9; macOS still ships runners for it.
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest
      - run: python scripts/doctor.py --work ./ci-work
        # Exit 2 means "not enough room", which is a valid answer on a small CI runner.
        shell: bash
        continue-on-error: true
